<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#0f0f14" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="description" content="CLIENTIVITY — Personal Operating System for Daily Planning, Habits, Study, Tasks & Progress Tracking." />
  <title>CLIENTIVITY — Personal Operating System</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />

  <style>
    /* ================================================================
       CLIENTIVITY — Single-File Production Design System
       ================================================================ */
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html { font-size: 16px; -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      overscroll-behavior: none;
      overflow: hidden;
      height: 100dvh;
      width: 100%;
      background: var(--bg-primary);
      color: var(--text-primary);
    }
    button { cursor: pointer; font: inherit; border: none; background: none; color: inherit; }
    input, textarea, select { font: inherit; color: inherit; border: none; background: none; outline: none; }
    a { color: inherit; text-decoration: none; }

    /* ---------- Design Tokens ---------- */
    :root {
      --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px; --sp-5: 20px;
      --sp-6: 24px; --sp-8: 32px; --sp-10: 40px;
      --r-sm: 8px; --r-md: 12px; --r-lg: 16px; --r-xl: 20px; --r-full: 9999px;
      --ease: cubic-bezier(.4,0,.2,1);
      --t-fast: 150ms var(--ease);
      --c-study: #4EA8F6;
      --c-fitness: #00D68F;
      --c-work: #A78BFA;
      --c-personal: #F59E0B;
      --c-deadline: #F87171;
      --c-completed: #34D399;
      --c-accent: #6C5CE7;
      --nav-h: 70px;
      --sidebar-w: 250px;
    }

    [data-theme="dark"], :root {
      --bg-primary: #0f0f14;
      --bg-secondary: #16161d;
      --bg-card: #1c1c26;
      --bg-card-hover: #232330;
      --bg-input: #1e1e28;
      --bg-modal: rgba(0,0,0,.75);
      --border: rgba(255,255,255,.07);
      --border-hover: rgba(255,255,255,.15);
      --text-primary: #f0f0f5;
      --text-secondary: #8b8b9e;
      --text-tertiary: #5a5a70;
      --glass: rgba(28,28,38,.75);
    }

    [data-theme="oled"] {
      --bg-primary: #000000;
      --bg-secondary: #09090b;
      --bg-card: #121215;
      --bg-card-hover: #1a1a20;
      --bg-input: #121218;
      --border: rgba(255,255,255,.1);
    }

    [data-theme="light"] {
      --bg-primary: #f5f5f8;
      --bg-secondary: #ebebf0;
      --bg-card: #ffffff;
      --bg-card-hover: #f8f8fb;
      --bg-input: #f0f0f5;
      --bg-modal: rgba(0,0,0,.35);
      --border: rgba(0,0,0,.08);
      --text-primary: #1a1a2e;
      --text-secondary: #6b6b80;
      --text-tertiary: #9b9bb0;
      --glass: rgba(255,255,255,.75);
    }

    #app { display: flex; height: 100dvh; width: 100%; overflow: hidden; }

    /* ---------- Sidebar ---------- */
    .app-sidebar {
      display: none; width: var(--sidebar-w); height: 100dvh;
      background: var(--bg-secondary); border-right: 1px solid var(--border);
      flex-shrink: 0; overflow-y: auto; padding: var(--sp-6) 0;
    }
    .sidebar-logo {
      padding: var(--sp-2) var(--sp-6) var(--sp-6);
      display: flex; align-items: center; gap: var(--sp-3);
      font-weight: 800; font-size: .875rem; letter-spacing: 2px; text-transform: uppercase;
      color: var(--c-accent);
    }
    .sidebar-nav { display: flex; flex-direction: column; gap: var(--sp-1); padding: 0 var(--sp-3); }
    .sidebar-nav-item {
      display: flex; align-items: center; gap: var(--sp-3);
      padding: var(--sp-3) var(--sp-4); border-radius: var(--r-md);
      font-size: .875rem; font-weight: 500; color: var(--text-secondary);
      transition: all var(--t-fast);
    }
    .sidebar-nav-item:hover { background: var(--bg-card); color: var(--text-primary); }
    .sidebar-nav-item.active { background: rgba(108,92,231,.12); color: var(--c-accent); font-weight: 700; }

    .app-main { flex: 1; height: 100dvh; overflow: hidden; display: flex; flex-direction: column; }
    .app-content {
      flex: 1; overflow-y: auto; overflow-x: hidden;
      padding-bottom: calc(var(--nav-h) + env(safe-area-inset-bottom, 0px) + 20px);
    }
    @media (min-width: 1024px) {
      .app-content { padding-bottom: var(--sp-8); }
      .app-sidebar { display: block; }
      .bottom-nav { display: none !important; }
    }

    /* ---------- Bottom Nav ---------- */
    .bottom-nav {
      position: fixed; bottom: 0; left: 0; right: 0;
      height: calc(var(--nav-h) + env(safe-area-inset-bottom, 0px));
      padding-bottom: env(safe-area-inset-bottom, 0px);
      background: var(--glass); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-around; z-index: 100;
    }
    .nav-item {
      display: flex; flex-direction: column; align-items: center; gap: 2px;
      padding: var(--sp-2) var(--sp-3); color: var(--text-tertiary); min-width: 56px;
    }
    .nav-item.active { color: var(--c-accent); }
    .nav-item span { font-size: .625rem; font-weight: 600; }

    /* ---------- Cards & Layout ---------- */
    .page { padding: var(--sp-5) var(--sp-4); max-width: 720px; margin: 0 auto; animation: pageIn .3s var(--ease); }
    @media (min-width: 1024px) { .page { max-width: 900px; padding: var(--sp-8); } }
    @keyframes pageIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

    .card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--r-lg); padding: var(--sp-4); }
    .grid { display: grid; }
    .grid-2 { grid-template-columns: repeat(2, 1fr); }
    .grid-3 { grid-template-columns: repeat(3, 1fr); }
    @media (max-width: 640px) { .grid-2, .grid-3 { grid-template-columns: 1fr; } }

    .flex { display: flex; }
    .flex-col { flex-direction: column; }
    .items-center { align-items: center; }
    .justify-between { justify-content: space-between; }
    .gap-2 { gap: var(--sp-2); }
    .gap-3 { gap: var(--sp-3); }
    .gap-4 { gap: var(--sp-4); }

    /* ---------- Buttons & Badges ---------- */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: var(--sp-2);
      padding: var(--sp-3) var(--sp-5); border-radius: var(--r-full);
      font-size: .875rem; font-weight: 600; min-height: 42px; transition: all var(--t-fast);
    }
    .btn-primary { background: linear-gradient(135deg, var(--c-accent), #8B5CF6); color: white; }
    .btn-secondary { background: var(--bg-card); border: 1px solid var(--border); color: var(--text-primary); }
    .btn-sm { padding: var(--sp-2) var(--sp-3); font-size: .8125rem; min-height: 36px; }
    .btn-icon { width: 38px; height: 38px; padding: 0; border-radius: var(--r-md); display: inline-flex; align-items: center; justify-content: center; }

    .badge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: var(--r-full); font-size: .6875rem; font-weight: 600; }
    .badge-study { background: rgba(78,168,246,.15); color: var(--c-study); }
    .badge-fitness { background: rgba(0,214,143,.15); color: var(--c-fitness); }
    .badge-work { background: rgba(167,139,250,.15); color: var(--c-work); }
    .badge-personal { background: rgba(245,158,11,.15); color: var(--c-personal); }
    .badge-deadline { background: rgba(248,113,113,.15); color: var(--c-deadline); }

    .progress-bar { width: 100%; height: 6px; background: var(--bg-input); border-radius: var(--r-full); overflow: hidden; }
    .progress-bar-fill { height: 100%; background: var(--c-accent); border-radius: var(--r-full); transition: width .5s var(--ease); }

    .checkbox {
      width: 22px; height: 22px; border-radius: var(--r-sm); border: 2px solid var(--border-hover);
      display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0;
    }
    .checkbox.checked { background: var(--c-accent); border-color: var(--c-accent); }

    /* ---------- FAB Quick Capture ---------- */
    .fab {
      position: fixed; bottom: calc(var(--nav-h) + 16px); right: 20px;
      width: 56px; height: 56px; border-radius: var(--r-full);
      background: linear-gradient(135deg, var(--c-accent), #8B5CF6); color: white;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 6px 24px rgba(108,92,231,.4); z-index: 90;
    }
    .fab-menu {
      position: fixed; bottom: calc(var(--nav-h) + 82px); right: 20px;
      display: flex; flex-direction: column; gap: var(--sp-2); z-index: 89;
    }
    .fab-menu-item {
      display: flex; align-items: center; gap: var(--sp-3); padding: var(--sp-3) var(--sp-4);
      background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--r-full);
      font-size: .8125rem; font-weight: 600; white-space: nowrap; box-shadow: 0 4px 12px rgba(0,0,0,.3);
    }

    /* ---------- Notion Calendar & Kanban Styles ---------- */
    .notion-cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); border-radius: var(--r-lg); overflow: hidden; border: 1px solid var(--border); }
    .notion-cal-cell {
      min-height: 95px; padding: var(--sp-2); background: var(--bg-primary); border-bottom: 1px solid var(--border); border-right: 1px solid var(--border);
      display: flex; flex-direction: column; gap: 3px; cursor: pointer;
    }
    .notion-cal-cell:hover { background: var(--bg-card-hover); }
    .notion-cal-cell.is-today { background: rgba(108,92,231,.08); }
    .notion-cal-pill { font-size: .625rem; font-weight: 600; padding: 2px 5px; border-radius: var(--r-sm); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .kanban-board { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: var(--sp-4); }
    .kanban-col { background: var(--bg-secondary); border: 1px solid var(--border); border-radius: var(--r-lg); padding: var(--sp-4); min-height: 300px; }

    /* ---------- Modal & Toast ---------- */
    .modal-overlay {
      position: fixed; inset: 0; background: var(--bg-modal); backdrop-filter: blur(8px);
      z-index: 200; display: flex; align-items: flex-end; justify-content: center;
    }
    @media (min-width: 768px) { .modal-overlay { align-items: center; } }
    .modal { background: var(--bg-secondary); border: 1px solid var(--border); border-radius: var(--r-xl); width: 100%; max-width: 480px; padding: var(--sp-6); }

    .toast {
      position: fixed; bottom: calc(var(--nav-h) + 24px); left: 50%; transform: translateX(-50%);
      padding: var(--sp-3) var(--sp-5); background: var(--bg-card); border: 1px solid var(--border);
      border-radius: var(--r-full); font-size: .8125rem; font-weight: 600; z-index: 300; white-space: nowrap;
    }

    .hidden { display: none !important; }
    .label { font-size: .6875rem; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--text-tertiary); }
    .form-group { display: flex; flex-direction: column; gap: var(--sp-1); margin-bottom: var(--sp-3); }
    .form-input, .form-select, .form-textarea {
      width: 100%; padding: var(--sp-3); background: var(--bg-input); border: 1px solid var(--border);
      border-radius: var(--r-md); color: var(--text-primary); font-size: .875rem;
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <script>
    /* ================================================================
       CLIENTIVITY — Single-File Standalone Operating Engine
       ================================================================ */

    // Data Storage Engine
    const PREFIX = 'clientivity_';
    const store = {
      load: (k, fb) => { try { const r = localStorage.getItem(PREFIX + k); return r ? JSON.parse(r) : fb; } catch { return fb; } },
      save: (k, d) => { try { localStorage.setItem(PREFIX + k, JSON.stringify(d)); } catch(e){} },
      todayKey: () => new Date().toISOString().split('T')[0],
      getSettings() { return { name: 'Prerana', theme: 'dark', ...this.load('settings', {}) }; },
      saveSettings(s) { this.save('settings', { ...this.getSettings(), ...s }); },

      getNonNegotiables() {
        return this.load('nonNegotiables', [
          { id: 'nn1', title: 'Move your body', icon: '🏃‍♀️', target: 30, unit: 'minutes', color: '#00D68F' },
          { id: 'nn2', title: 'Study — 1 hour minimum', icon: '📖', target: 60, unit: 'minutes', color: '#4EA8F6' },
          { id: 'nn3', title: 'Skill/Work — 2 hours', icon: '💻', target: 120, unit: 'minutes', color: '#A78BFA' },
          { id: 'nn4', title: 'Sleep target', icon: '😴', target: 1, unit: 'checkbox', color: '#818CF8' },
          { id: 'nn5', title: 'Read / Learn', icon: '📚', target: 20, unit: 'pages', color: '#F59E0B' }
        ]);
      },

      getTasks() { return this.load('tasks', []); },
      saveTasks(t) { this.save('tasks', t); },
      addTask(task) { const list = this.getTasks(); list.push({ ...task, id: 't_' + Date.now(), status: 'pending' }); this.saveTasks(list); },
      updateTask(id, up) { this.saveTasks(this.getTasks().map(t => t.id === id ? { ...t, ...up } : t)); },

      getDeadlines() { return this.load('deadlines', []); },
      saveDeadlines(d) { this.save('deadlines', d); },
      addDeadline(d) { const list = this.getDeadlines(); list.push({ ...d, id: 'd_' + Date.now() }); this.saveDeadlines(list); },

      getSubjects() {
        return this.load('subjects', [
          { id: 'sub1', name: 'Mathematics', color: '#4EA8F6', weeklyGoal: 420 },
          { id: 'sub2', name: 'Programming', color: '#A78BFA', weeklyGoal: 300 }
        ]);
      },
      getSkills() {
        return this.load('skills', [
          { id: 'sk1', name: 'Video Editing', color: '#F472B6', weeklyGoal: 420 },
          { id: 'sk2', name: 'Writing', color: '#00D68F', weeklyGoal: 300 }
        ]);
      },

      getStudySessions() { return this.load('studySessions', []); },
      addStudySession(s) { const list = this.getStudySessions(); list.push({ ...s, id: 'st_' + Date.now() }); this.save('studySessions', list); },
      getSkillSessions() { return this.load('skillSessions', []); },
      addSkillSession(s) { const list = this.getSkillSessions(); list.push({ ...s, id: 'sk_' + Date.now() }); this.save('skillSessions', list); }
    };

    // Icons SVG Generator
    const icon = (name, size = 20) => {
      const paths = {
        home: '<path d="M3 9.5L12 3l9 6.5V20a1 1 0 01-1 1H4a1 1 0 01-1-1V9.5z"/>',
        today: '<rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>',
        tasks: '<path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/>',
        progress: '<line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/>',
        more: '<circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/>',
        deadline: '<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>',
        habits: '<path d="M22 11.08V12a10 10 0 11-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/>',
        study: '<path d="M2 3h6a4 4 0 014 4v14a3 3 0 00-3-3H2z"/><path d="M22 3h-6a4 4 0 00-4 4v14a3 3 0 013-3h7z"/>',
        skills: '<polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>',
        timer: '<circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2"/><line x1="12" y1="1" x2="12" y2="3"/>',
        calendar: '<rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>',
        settings: '<circle cx="12" cy="12" r="3"/><path d="M12 1v2M12 21v2M1 12h2M21 12h2"/>',
        plus: '<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>',
        check: '<polyline points="20 6 9 17 4 12"/>',
        trash: '<polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/>'
      }[name] || '<circle cx="12" cy="12" r="8"/>';
      return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${paths}</svg>`;
    };

    function showToast(msg) {
      const t = document.createElement('div');
      t.className = 'toast';
      t.innerText = msg;
      document.body.appendChild(t);
      setTimeout(() => t.remove(), 2500);
    }

    let currentRoute = 'home';

    // Route Views
    function renderHome() {
      const habits = store.getNonNegotiables();
      return `
        <div class="page">
          <div style="margin-bottom:var(--sp-5)">
            <h1 class="font-bold text-xl">Good morning, ${store.getSettings().name}</h1>
            <p class="text-xs text-secondary">${new Date().toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' })}</p>
          </div>

          <div class="card flex flex-col items-center justify-center" style="padding:var(--sp-6);margin-bottom:var(--sp-5);background:linear-gradient(135deg, rgba(108,92,231,0.15), rgba(78,168,246,0.1))">
            <div style="font-size:42px;font-weight:900;color:var(--c-accent)">0%</div>
            <p class="text-xs text-secondary mt-1">Today's Operating Score</p>
          </div>

          <p class="label" style="margin-bottom:var(--sp-3)">Non-Negotiables</p>
          <div class="flex flex-col gap-2">
            ${habits.map(h => `
              <div class="card flex items-center justify-between" style="padding:var(--sp-3) var(--sp-4)">
                <div class="flex items-center gap-3">
                  <span style="font-size:20px">${h.icon}</span>
                  <div>
                    <div class="font-bold text-sm">${h.title}</div>
                    <div class="text-xs text-secondary">Target: ${h.target} ${h.unit}</div>
                  </div>
                </div>
                <div class="checkbox" onclick="this.classList.toggle('checked')">${icon('check', 14)}</div>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    function renderTasks() {
      const tasks = store.getTasks();
      return `
        <div class="page">
          <div class="flex items-center justify-between" style="margin-bottom:var(--sp-5)">
            <h1 class="font-bold text-xl">Tasks</h1>
            <button class="btn btn-primary btn-sm" onclick="openNewTaskModal()">${icon('plus', 16)} Add Task</button>
          </div>

          ${tasks.length === 0 ? `
            <div class="card" style="text-align:center;padding:var(--sp-8);color:var(--text-tertiary)">
              No tasks added yet. Click <strong>Add Task</strong> above to get started.
            </div>
          ` : `
            <div class="flex flex-col gap-2">
              ${tasks.map(t => `
                <div class="card flex items-center justify-between" style="padding:var(--sp-3) var(--sp-4)">
                  <div class="flex items-center gap-3">
                    <div class="checkbox ${t.status === 'completed' ? 'checked' : ''}" onclick="toggleTaskStatus('${t.id}')">${icon('check', 14)}</div>
                    <span class="font-semibold text-sm ${t.status === 'completed' ? 'text-secondary' : ''}" style="${t.status === 'completed' ? 'text-decoration:line-through' : ''}">${t.title}</span>
                  </div>
                  <span class="badge badge-work">${t.category || 'Work'}</span>
                </div>
              `).join('')}
            </div>
          `}
        </div>
      `;
    }

    function renderCalendar() {
      const days = Array.from({ length: 30 }, (_, i) => i + 1);
      return `
        <div class="page">
          <div class="flex items-center justify-between" style="margin-bottom:var(--sp-5)">
            <h1 class="font-bold text-xl">Notion-Style Calendar</h1>
            <button class="btn btn-primary btn-sm" onclick="navigate('tasks')">+ Quick Entry</button>
          </div>

          <div class="notion-cal-grid">
            ${['MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT', 'SUN'].map(d => `<div style="padding:8px;font-weight:700;font-size:11px;color:var(--text-tertiary);text-align:center">${d}</div>`).join('')}
            ${days.map(d => `
              <div class="notion-cal-cell ${d === new Date().getDate() ? 'is-today' : ''}">
                <span class="font-bold text-xs">${d}</span>
                ${d % 3 === 0 ? `<div class="notion-cal-pill notion-cal-pill-task">📋 Focus task</div>` : ''}
                ${d % 5 === 0 ? `<div class="notion-cal-pill notion-cal-pill-deadline">🚨 Exam</div>` : ''}
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    function renderSettings() {
      const s = store.getSettings();
      return `
        <div class="page">
          <h1 class="font-bold text-xl" style="margin-bottom:var(--sp-5)">Settings & Deploy</h1>

          <div class="card" style="margin-bottom:var(--sp-4)">
            <p class="label" style="margin-bottom:var(--sp-3)">Single File Netlify Deployment</p>
            <p class="text-xs text-secondary" style="margin-bottom:var(--sp-3)">This file is completely self-contained. You can upload it directly to Netlify, Vercel, or GitHub Pages!</p>
            <button class="btn btn-primary btn-sm" onclick="exportBackup()">${icon('plus', 14)} Export Data JSON</button>
          </div>

          <div class="card">
            <p class="label" style="margin-bottom:var(--sp-3)">Theme Selection</p>
            <select class="form-select" onchange="changeTheme(this.value)">
              <option value="dark" ${s.theme === 'dark' ? 'selected' : ''}>Sleek Dark</option>
              <option value="oled" ${s.theme === 'oled' ? 'selected' : ''}>OLED True Black</option>
              <option value="light" ${s.theme === 'light' ? 'selected' : ''}>Clean Light</option>
            </select>
          </div>
        </div>
      `;
    }

    // App Shell
    function renderApp() {
      document.documentElement.setAttribute('data-theme', store.getSettings().theme);
      const app = document.getElementById('app');
      app.innerHTML = `
        <aside class="app-sidebar">
          <div class="sidebar-logo">⚡ CLIENTIVITY</div>
          <nav class="sidebar-nav">
            <a href="#home" class="sidebar-nav-item ${currentRoute === 'home' ? 'active' : ''}" onclick="navigate('home')">${icon('home')} Home</a>
            <a href="#tasks" class="sidebar-nav-item ${currentRoute === 'tasks' ? 'active' : ''}" onclick="navigate('tasks')">${icon('tasks')} Tasks</a>
            <a href="#calendar" class="sidebar-nav-item ${currentRoute === 'calendar' ? 'active' : ''}" onclick="navigate('calendar')">${icon('calendar')} Calendar</a>
            <a href="#settings" class="sidebar-nav-item ${currentRoute === 'settings' ? 'active' : ''}" onclick="navigate('settings')">${icon('settings')} Settings</a>
          </nav>
        </aside>

        <div class="app-main">
          <div class="app-content" id="content"></div>
        </div>

        <nav class="bottom-nav">
          <button class="nav-item ${currentRoute === 'home' ? 'active' : ''}" onclick="navigate('home')">${icon('home')}<span>Home</span></button>
          <button class="nav-item ${currentRoute === 'tasks' ? 'active' : ''}" onclick="navigate('tasks')">${icon('tasks')}<span>Tasks</span></button>
          <button class="nav-item ${currentRoute === 'calendar' ? 'active' : ''}" onclick="navigate('calendar')">${icon('calendar')}<span>Calendar</span></button>
          <button class="nav-item ${currentRoute === 'settings' ? 'active' : ''}" onclick="navigate('settings')">${icon('settings')}<span>Settings</span></button>
        </nav>
      `;
      navigate(location.hash.slice(1) || 'home');
    }

    function navigate(route) {
      currentRoute = route || 'home';
      location.hash = currentRoute;
      const content = document.getElementById('content');
      if (route === 'home') content.innerHTML = renderHome();
      else if (route === 'tasks') content.innerHTML = renderTasks();
      else if (route === 'calendar') content.innerHTML = renderCalendar();
      else if (route === 'settings') content.innerHTML = renderSettings();
    }

    function openNewTaskModal() {
      const html = `
        <div class="modal-overlay" id="modal">
          <div class="modal">
            <h3 class="font-bold text-lg" style="margin-bottom:12px">New Task</h3>
            <div class="form-group">
              <label class="label">Task Title</label>
              <input class="form-input" id="new-t-title" placeholder="What needs to be done?" />
            </div>
            <div class="form-group">
              <label class="label">Category</label>
              <select class="form-select" id="new-t-cat">
                <option value="Study">Study</option>
                <option value="Work">Work</option>
                <option value="Personal">Personal</option>
              </select>
            </div>
            <div class="flex justify-between mt-4">
              <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
              <button class="btn btn-primary" onclick="saveNewTask()">Save Task</button>
            </div>
          </div>
        </div>
      `;
      document.body.insertAdjacentHTML('beforeend', html);
    }

    function closeModal() { document.getElementById('modal')?.remove(); }
    function saveNewTask() {
      const title = document.getElementById('new-t-title').value.trim();
      const category = document.getElementById('new-t-cat').value;
      if (title) {
        store.addTask({ title, category });
        showToast('Task added!');
        closeModal();
        navigate('tasks');
      }
    }
    function toggleTaskStatus(id) {
      const t = store.getTasks().find(x => x.id === id);
      if (t) {
        store.updateTask(id, { status: t.status === 'completed' ? 'pending' : 'completed' });
        navigate('tasks');
      }
    }
    function changeTheme(val) {
      store.saveSettings({ theme: val });
      document.documentElement.setAttribute('data-theme', val);
      showToast('Theme updated');
    }
    function exportBackup() {
      const blob = new Blob([JSON.stringify(localStorage)], { type: 'application/json' });
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'clientivity_backup.json'; a.click();
    }

    document.addEventListener('DOMContentLoaded', renderApp);
    window.addEventListener('hashchange', () => navigate(location.hash.slice(1)));
  </script>
</body>
</html>
